<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Investment Platform</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 380px; }
        .screen { display: none; flex-direction: column; align-items: center; }
        .active-screen { display: flex; }

        .lang-bar { width: 100%; display: flex; justify-content: center; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .lang-btn { background: #222; border: 1px solid #ff7700; color: #fff; border-radius: 4px; padding: 3px 6px; font-size: 0.7rem; cursor: pointer; }
        .lang-btn.active { background: #ff7700; color: #000; font-weight: bold; }

        .input-group { width: 100%; margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; background: transparent; border: 2px solid #ff7700; color: #fff; border-radius: 4px; box-sizing: border-box; }
        select option { background: #000; color: #fff; }

        .row-phone { display: flex; gap: 8px; width: 100%; }
        .flag-select { width: 35%; }
        .phone-input { width: 65%; }

        .btn-white { background: #fff; color: #000; font-weight: bold; padding: 10px 25px; border-radius: 12px; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .btn-green { background: #fff; color: #00a651; font-weight: bold; padding: 8px 15px; border-radius: 12px; border: none; cursor: pointer; text-align: center; margin: 10px 0; width: 100%; }
        .link-orange { color: #ff7700; font-size: 0.8rem; text-decoration: none; margin-top: 10px; cursor: pointer; }

        .dash-header { background: #ff7700; border-radius: 15px; width: 100%; padding: 12px; box-sizing: border-box; text-align: center; color: #000; }
        .id-text { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; }
        .balance-box { background: #ff9433; border-radius: 12px; padding: 8px; display: flex; justify-content: space-around; }
        .bal-title { font-size: 0.7rem; color: #333; }
        .bal-amount { font-weight: bold; font-size: 1rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .menu-container { background: #444; border-radius: 15px; width: 100%; padding: 15px; box-sizing: border-box; margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
        .menu-btn { background: #fff; color: #d96200; font-weight: bold; padding: 12px; border-radius: 10px; text-align: center; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- BARRE DE SELECTION DE LANGUE -->
    <div class="lang-bar">
        <button class="lang-btn active" onclick="setLanguage('en')">🇺🇸 EN</button>
        <button class="lang-btn" onclick="setLanguage('fr')">🇫🇷 FR</button>
        <button class="lang-btn" onclick="setLanguage('es')">🇪🇸 ES</button>
        <button class="lang-btn" onclick="setLanguage('de')">🇩🇪 DE</button>
        <button class="lang-btn" onclick="setLanguage('zh')">🇨🇳 中文</button>
        <button class="lang-btn" onclick="setLanguage('ar')">🇸🇦 العربية</button>
    </div>

    <!-- SCREEN 1: REGISTER -->
    <div id="screen1" class="screen active-screen">
        <div class="input-group">
            <label id="lbl_reg_email">Email Address</label>
            <input type="email" id="reg_email">
        </div>
        <div class="input-group">
            <div class="row-phone">
                <div class="flag-select">
                    <label id="lbl_reg_country">Country</label>
                    <select id="reg_country" onchange="updatePrefix('reg')">
                        <!-- PAYS DU MONDE ENTIER -->
                        <option value="+1">🇺🇸 +1 (USA/Canada)</option>
                        <option value="+44">🇬🇧 +44 (UK)</option>
                        <option value="+33">🇫🇷 +33 (France)</option>
                        <option value="+49">🇩🇪 +49 (Germany)</option>
                        <option value="+34">🇪🇸 +34 (Spain)</option>
                        <option value="+39">🇮🇹 +39 (Italy)</option>
                        <option value="+86">🇨🇳 +86 (China)</option>
                        <option value="+81">🇯🇵 +81 (Japan)</option>
                        <option value="+91">🇮🇳 +91 (India)</option>
                        <option value="+971">🇦🇪 +971 (UAE)</option>
                        <option value="+966">🇸🇦 +966 (Saudi Arabia)</option>
                        <option value="+261">🇲🇬 +261 (Madagascar)</option>
                        <option value="+225">🇨🇮 +225 (Côte d'Ivoire)</option>
                        <option value="+221">🇸🇳 +221 (Sénégal)</option>
                        <option value="+237">🇨🇲 +237 (Cameroun)</option>
                        <option value="+234">🇳🇬 +234 (Nigeria)</option>
                        <option value="+27">🇿🇦 +27 (South Africa)</option>
                        <option value="+55">🇧🇷 +55 (Brazil)</option>
                        <option value="+52">🇲🇽 +52 (Mexico)</option>
                        <option value="+61">🇦🇺 +61 (Australia)</option>
                        <option value="+7">🇷🇺 +7 (Russia)</option>
                    </select>
                </div>
                <div class="phone-input">
                    <label id="lbl_reg_phone">Phone Number</label>
                    <input type="text" id="reg_phone" placeholder="+1">
                </div>
            </div>
        </div>
        <div class="input-group">
            <label id="lbl_reg_pass">Password</label>
            <input type="password" id="reg_pass">
        </div>
        <div class="input-group">
            <label id="lbl_reg_pass2">Confirm Password</label>
            <input type="password" id="reg_pass2">
        </div>
        <button class="btn-white" id="btn_register" onclick="submitRegister()">CREATE ACCOUNT</button>
        <span class="link-orange" id="lnk_to_login" onclick="showScreen('screen2')">Sign In / Connexion</span>
    </div>

    <!-- SCREEN 2: LOGIN -->
    <div id="screen2" class="screen">
        <div class="input-group" style="margin-top: 40px;">
            <label id="lbl_login_id">Email / Phone Number</label>
            <input type="text" id="login_id">
        </div>
        <div class="input-group">
            <label id="lbl_login_pass">Password</label>
            <input type="password" id="login_pass">
        </div>
        <button class="btn-white" id="btn_login" onclick="submitLogin()">LOG IN</button>
        <span class="link-orange" id="lnk_to_reg" onclick="showScreen('screen1')">Create Account</span>
    </div>

    <!-- DASHBOARD -->
    <div id="screenDashboard" class="screen">
        <div class="dash-header">
            <div class="id-text" id="dash_id">ID: --------</div>
            <div class="balance-box">
                <div>
                    <div class="bal-title" id="lbl_solde1">Total Balance 1</div>
                    <div class="bal-amount" id="dash_solde1">0.00 MGA</div>
                </div>
                <div>
                    <div class="bal-title" id="lbl_solde2">Total Balance 2</div>
                    <div class="bal-amount" id="dash_solde2">0.00 MGA</div>
                </div>
            </div>
        </div>

        <div id="statusBtnContainer" style="width:100%;"></div>

        <div class="menu-container" id="menuMain">
            <div class="menu-btn" id="btn_menu_pass">Login Password</div>
            <div class="menu-btn" id="btn_menu_service" onclick="openServiceClient()" style="cursor:pointer;">Customer Service</div>
            <div class="menu-btn" id="btn_menu_tx">Transaction Details</div>
        </div>
    </div>

    <!-- SCREEN 4: ACTIVATION -->
    <div id="screen4" class="screen">
        <div class="input-group">
            <label id="lbl_act_nom">LAST NAME</label>
            <input type="text" id="act_nom">
        </div>
        <div class="input-group">
            <label id="lbl_act_prenom">FIRST NAME</label>
            <input type="text" id="act_prenom">
        </div>
        <div class="input-group">
            <label id="lbl_act_sexe">GENDER</label>
            <input type="text" id="act_sexe">
        </div>
        <div class="input-group">
            <div class="row-phone">
                <div class="flag-select">
                    <label id="lbl_act_country">Country</label>
                    <select id="act_country" onchange="updatePrefix('act')">
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+33">🇫🇷 +33</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+34">🇪🇸 +34</option>
                        <option value="+86">🇨🇳 +86</option>
                        <option value="+971">🇦🇪 +971</option>
                        <option value="+261">🇲🇬 +261</option>
                        <option value="+225">🇨🇮 +225</option>
                        <option value="+221">🇸🇳 +221</option>
                        <option value="+237">🇨🇲 +237</option>
                    </select>
                </div>
                <div class="phone-input">
                    <label id="lbl_act_phone">Phone Number</label>
                    <input type="text" id="act_phone" value="+1">
                </div>
            </div>
        </div>
        <button class="btn-white" id="btn_act_submit" onclick="submitActivation()">SUBMIT</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
